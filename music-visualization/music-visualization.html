<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualization</title>
</head>
<body>
<svg id="svg" width="800" height="500"></svg>

<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const svg = d3.select("#svg")
  .style("border", "1px solid black")
  .style("background", "#f9f9f9");

d3.csv("./high_popularity_spotify_data.csv")
.then(data => {
    const energyAndDanceability = data.map(track => ({
        energy: +track.energy,
        danceability: +track.danceability,
        title: track.track_name || "Unknown track"
    }));

    const margin = { top: 40, right: 30, bottom: 60, left: 70 };
    const width = 800 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    const xScale = d3.scaleLinear()
      .domain([0, 1])
      .range([margin.left, margin.left + width]);

    const yScale = d3.scaleLinear()
      .domain([0, 1])
      .range([margin.top + height, margin.top]);

    svg.append("g")
      .attr("transform", `translate(0,${margin.top + height})`)
      .call(d3.axisBottom(xScale).ticks(6).tickFormat(d3.format(".0%")));

    svg.append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(yScale).ticks(6).tickFormat(d3.format(".0%")));

    svg.append("text")
      .attr("x", margin.left + width / 2)
      .attr("y", 490)
      .attr("text-anchor", "middle")
      .text("Danceability");

    svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -(margin.top + height / 2))
      .attr("y", 18)
      .attr("text-anchor", "middle")
      .text("Energy");

    svg.selectAll("circle")
      .data(energyAndDanceability)
      .enter()
      .append("circle")
      .attr("cx", d => xScale(d.danceability))
      .attr("cy", d => yScale(d.energy))
      .attr("r", 5)
      .attr("fill", "#d62728")
      .attr("opacity", 0.75)
      .append("title")
      .text(d => `${d.title}: Energy ${d.energy}, Danceability ${d.danceability}`);

    svg.append("text")
      .attr("x", margin.left + width / 2)
      .attr("y", 25)
      .attr("text-anchor", "middle")
      .style("font-size", "16px")
      .style("font-weight", "bold")
      .text("Energy vs Danceability");
})

</script>

</body>
</html>
